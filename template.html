<title>Jerebu Watch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Malaysia haze outlook: today's Air Pollutant Index, a 3-day forecast for every DOE station, and the Indonesian fires the smoke comes from.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Geist+Mono:wght@400;500&display=swap">
<style>
/*__LEAFLET_CSS__*/
</style>
<style>
/* Layout: the Elevate workspace — a 44px app bar over one full-screen map, a frosted-glass side panel
   on the left holding the five modes, and a quiet command deck (caption, legend, player) on the map.
   Under 760px the map sits on top, the panel flows below it and the modes become a bottom bar. */
:root{
  --background:#ffffff; --card:#ffffff; --muted:#f6f5f8; --foreground:#1f1b2d; --muted-fg:#59566a;
  --border:rgb(0 0 0/.08); --input:rgb(0 0 0/.15); --accent:color-mix(in srgb,#1f1b2d 6%,#ffffff);
  --brand:#bd9fff; --brand-hover:#cdb6ff; --brand-fg:#1b1528; --brand-soft:#efe9ff; --ring:#6d4aff;
  --green:#15803d; --amber:#b45309; --red:#c81e1e; --blue:#2563eb; --magenta:#be185d; --teal:#0f766e; --violet:#6d4aff;
  /* map layers: literal colours bright enough for both basemaps; the API scale is DOE's official one */
  --sea:#e7ecf2; --land:#f5f4f2; --land-my:#ffffff; --land-id:#efece8; --coast:rgb(31 27 45/.16); --vignette:rgb(31 27 45/.06);
  --api-good:#4f97e3; --api-mod:#3faf5b; --api-unh:#f2c12e; --api-vunh:#f0812c; --api-haz:#e5484d; --chip-ink:#1b1528;
  --fire-new:#ffb000; --fire-mid:#f06a1d; --fire-old:#9d3a22; --plume:#b4532a; --wind:#8a93a8; --back:#2563eb;
  --float-shadow:0 24px 60px -28px rgba(0,0,0,.45);
  --font-sans:"Inter",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --font-display:"Newsreader",Georgia,"Times New Roman",serif;
  --font-mono:"Geist Mono",ui-monospace,Consolas,monospace;
  --pw:400px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --background:#14111d; --card:#1c1927; --muted:#25212f; --foreground:#fafafa; --muted-fg:#b3b0bf;
  --border:rgb(255 255 255/.1); --input:rgb(255 255 255/.2); --accent:color-mix(in srgb,#fafafa 8%,#1c1927);
  --brand-soft:#2a2140; --ring:#bd9fff;
  --green:#3ddc84; --amber:#ffb224; --red:#ff6b78; --blue:#6aa6ff; --magenta:#ff5cb3; --teal:#19e6c1; --violet:#b79bff;
  --sea:#121723; --land:#1e1c22; --land-my:#2a2732; --land-id:#222026; --coast:rgb(255 255 255/.12); --vignette:rgb(0 0 0/.45);
  --fire-old:#c0502e; --plume:#ffa66e; --wind:#6f7890; --back:#6aa6ff; --float-shadow:0 24px 60px -28px rgba(0,0,0,.9);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --background:#14111d; --card:#1c1927; --muted:#25212f; --foreground:#fafafa; --muted-fg:#b3b0bf;
  --border:rgb(255 255 255/.1); --input:rgb(255 255 255/.2); --accent:color-mix(in srgb,#fafafa 8%,#1c1927);
  --brand-soft:#2a2140; --ring:#bd9fff;
  --green:#3ddc84; --amber:#ffb224; --red:#ff6b78; --blue:#6aa6ff; --magenta:#ff5cb3; --teal:#19e6c1; --violet:#b79bff;
  --sea:#121723; --land:#1e1c22; --land-my:#2a2732; --land-id:#222026; --coast:rgb(255 255 255/.12); --vignette:rgb(0 0 0/.45);
  --fire-old:#c0502e; --plume:#ffa66e; --wind:#6f7890; --back:#6aa6ff; --float-shadow:0 24px 60px -28px rgba(0,0,0,.9);
  color-scheme:dark}

/* colour-blind-safe API scale (Okabe-Ito based); numbers are always printed on the markers too */
:root[data-cb="1"]{--api-good:#56b4e9;--api-mod:#009e73;--api-unh:#f0e442;--api-vunh:#d55e00;--api-haz:#882255}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--background);color:var(--foreground);font:14px/1.5 var(--font-sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:1000;background:var(--background)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:500;letter-spacing:-.025em}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
a{color:var(--violet)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted-fg)}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- app bar */
.app{height:100%;display:grid;grid-template-rows:44px minmax(0,1fr)}
.bar{position:relative;z-index:900;display:flex;align-items:center;gap:8px;background:var(--background);border-bottom:1px solid var(--border);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wordmark{display:inline-flex;align-items:center;gap:.36em;font:500 19px/1 var(--font-display);letter-spacing:-.03em;white-space:nowrap}
.wordmark svg{width:.92em;height:.92em}
.tag{border-radius:4px;background:var(--brand);color:var(--brand-fg);font-size:10px;line-height:1;font-weight:500;padding:3px 6px;white-space:nowrap}
.bar .ctx{font-size:12.5px;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin-left:6px}
.bar .spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border);
  background:var(--background);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--foreground)}
.btn:hover{background:var(--muted)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.brand{background:var(--brand);border-color:transparent;color:var(--brand-fg)}
.btn.brand:hover{background:var(--brand-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--accent)}
.btn.icon{width:32px;padding:0}

/* ---------- workspace */
.ws{position:relative;min-height:0;overflow:hidden}
.stage{position:absolute;inset:0}
#map{position:absolute;inset:0;z-index:0;background:var(--sea)}   /* own stacking context: keeps Leaflet's panes under the deck */
.vignette{position:absolute;inset:0;z-index:420;pointer-events:none;background:radial-gradient(120% 90% at 62% 50%,transparent 55%,var(--vignette))}
#three{position:absolute;top:0;bottom:0;right:0;left:var(--pw);z-index:430;background:var(--sea)}

.panel{position:absolute;z-index:600;top:0;left:0;bottom:0;width:min(var(--pw),calc(100% - 40px));display:flex;flex-direction:column;
  background:color-mix(in srgb,var(--background) 72%,transparent);-webkit-backdrop-filter:blur(8px) saturate(1.3);backdrop-filter:blur(8px) saturate(1.3);
  border-right:1px solid var(--border);padding-left:env(safe-area-inset-left,0px)}
.modes{display:flex;gap:2px;margin:12px 12px 6px;padding:3px;border-radius:999px;background:var(--muted);border:1px solid var(--border)}
.mode{flex:1;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:5px;height:30px;border:0;background:none;border-radius:999px;
  font-size:12.5px;font-weight:500;color:var(--muted-fg);cursor:pointer;white-space:nowrap}
.mode svg.i{display:none}
.mode:hover{color:var(--foreground)}
.mode[aria-selected="true"]{background:var(--background);color:var(--foreground);box-shadow:0 1px 2px rgb(0 0 0/.08),0 0 0 1px var(--border)}
.pbody{flex:1;min-height:0;overflow:auto;padding:6px 12px 18px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}

/* ---------- panel content */
.lead .meta{font-size:11.5px;color:var(--muted-fg)}
.lead .big{font:400 64px/1 var(--font-display);letter-spacing:-.035em;margin-top:6px}
.lead .big.sm{font-size:48px}
.lead .sub{font-size:17px;font-weight:500;letter-spacing:-.02em;line-height:1.3;margin-top:6px;text-wrap:balance}
.card{border-radius:14px;border:1px solid var(--border);background:var(--card);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;letter-spacing:-.01em}
.card-h .grow{flex:1;min-width:0}
.card-h small{display:block;font-size:11px;font-weight:400;color:var(--muted-fg);letter-spacing:0}
.itile{display:grid;place-items:center;width:28px;height:28px;border-radius:10px;flex:none}
.itile svg.i{width:14px;height:14px}
.h-blue{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.h-amber{background:color-mix(in srgb,var(--amber) 15%,transparent);color:var(--amber)}
.h-red{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.h-violet{background:color-mix(in srgb,var(--violet) 15%,transparent);color:var(--violet)}
.h-green{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.body{font-size:13px;line-height:1.6}
.note{font-size:11.5px;line-height:1.5;color:var(--muted-fg)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;border:1px solid;padding:0 8px;height:20px;font-size:10.5px;font-weight:500;white-space:nowrap}
.chip.violet{border-color:color-mix(in srgb,var(--violet) 30%,transparent);background:color-mix(in srgb,var(--violet) 10%,transparent);color:var(--violet)}
.chip.api{border-color:var(--border);background:var(--card);color:var(--foreground)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{min-width:0;border-radius:14px;border:1px solid var(--border);background:color-mix(in srgb,var(--foreground) 2%,transparent);padding:7px 10px}
.stat .k{font-size:11px;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25}
.stat .s{font-size:10.5px;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .bar{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:6px;background:var(--border)}
.stat .bar i{display:block;height:100%}
.callout{border-radius:14px;border:1px solid;padding:10px 12px;font-size:12.5px;line-height:1.55}
.callout.amber{border-color:color-mix(in srgb,var(--amber) 30%,transparent);background:color-mix(in srgb,var(--amber) 10%,transparent)}
.callout.red{border-color:color-mix(in srgb,var(--red) 40%,transparent);background:color-mix(in srgb,var(--red) 10%,transparent)}
.callout.info{border-color:var(--border);background:color-mix(in srgb,var(--foreground) 2%,transparent)}
.callout .ct{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;margin-bottom:4px}
.callout.amber .ct svg{color:var(--amber)} .callout.red .ct svg{color:var(--red)} .callout.info .ct svg{color:var(--green)}
.callout ul{margin:6px 0 0;padding-left:18px}
.callout li{margin:1px 0}
.tbl{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--card)}
.tbl table{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:color-mix(in srgb,var(--muted) 60%,transparent);color:var(--muted-fg);font-weight:500;font-size:11.5px;text-align:left;padding:7px 10px}
.tbl td{padding:7px 10px;border-top:1px solid var(--border);vertical-align:middle}
.tbl .r{text-align:right}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--accent)}
.tbl td small{display:block;color:var(--muted-fg);font-size:11px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.field{position:relative}
.field select{width:100%;height:36px;border-radius:999px;border:1px solid var(--input);background:var(--background);padding:0 34px 0 14px;font-size:13px;appearance:none;-webkit-appearance:none;cursor:pointer}
.field svg.i{position:absolute;right:12px;bottom:10px;width:16px;height:16px;pointer-events:none;color:var(--muted-fg)}
.reading{display:flex;align-items:flex-end;gap:12px}
.reading .v{font-size:52px;line-height:.9;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.gauge{position:relative;padding-top:4px}
.gauge .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;height:6px;border-radius:3px;overflow:hidden}
.gauge .pin{position:absolute;top:0;width:3px;height:14px;border-radius:2px;background:var(--foreground);transform:translateX(-50%);box-shadow:0 0 0 2px var(--card)}
.gauge .lbl{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:5px;font-size:10px;color:var(--muted-fg);line-height:1.25}
.gauge .lbl b{display:block;font-weight:500;color:var(--foreground);font-size:10.5px}
.srcs{display:flex;flex-direction:column;gap:9px}
.src .t{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.src .t b{font-weight:500}
.src .track{height:4px;border-radius:2px;background:var(--border);margin-top:4px;overflow:hidden}
.src .track i{display:block;height:100%;border-radius:2px;background:var(--violet)}
.src .w{font-size:11px;color:var(--muted-fg);margin-top:2px}
.src.click{cursor:pointer}
.src.click:hover b{color:var(--violet)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:999px;background:var(--input);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--background);transition:left .15s}
.switch input:checked{background:var(--violet)}
.switch input:checked::after{left:16px}
.flist button{display:grid;grid-template-columns:1fr auto;gap:0 8px;width:100%;text-align:left;border:0;background:none;padding:7px 12px;border-top:1px solid var(--border);cursor:pointer}
.flist button:first-child{border-top:0}
.flist button:hover{background:var(--accent)}
.flist button[aria-current="true"]{background:var(--brand-soft)}
.flist .n{font-size:12.5px;font-weight:500}
.flist .m{grid-column:1/-1;font-size:11px;color:var(--muted-fg)}
.flist .x{font:500 10px/1.8 var(--font-mono);color:var(--violet)}

/* ---------- charts (hand-drawn SVG) */
.chartwrap{position:relative}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg.chart .grid{stroke:var(--border);stroke-width:.6}
svg.chart text{fill:var(--muted-fg);font:9px var(--font-sans)}
svg.chart .yl{text-anchor:end}
svg.chart .xl{text-anchor:middle}
svg.chart .thr{stroke:var(--amber);stroke-width:1;stroke-dasharray:3 3}
svg.chart text.thl{fill:var(--amber);text-anchor:end}
svg.chart .now{stroke:var(--muted-fg);stroke-width:1;stroke-dasharray:2 3}
.ctip{position:absolute;pointer-events:none;background:var(--background);border:1px solid var(--border);border-radius:10px;padding:5px 8px;font-size:11px;box-shadow:var(--float-shadow);white-space:nowrap;z-index:5}
.ctip b{font-weight:600;font-variant-numeric:tabular-nums}
.legend-row{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted-fg)}
.legend-row span{display:inline-flex;align-items:center;gap:5px}
.legend-row .ln{width:14px;height:0;border-top:2px solid}
.legend-row .ln.d{border-top-style:dashed}

/* ---------- command deck */
.caption{position:absolute;z-index:450;top:16px;left:calc(var(--pw) + 22px);pointer-events:none;max-width:calc(100% - var(--pw) - 200px);
  text-shadow:0 0 2px var(--sea),0 0 4px var(--sea),0 0 8px var(--sea)}
.caption .e{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-fg)}
.caption .rg{font:400 clamp(1.6rem,2.6vw,2.4rem)/1 var(--font-display);letter-spacing:-.03em;margin:5px 0 6px}
.caption .m{font-size:12px;color:var(--muted-fg)}
.float{border-radius:18px;border:1px solid var(--border);background:color-mix(in srgb,var(--background) 95%,transparent);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:var(--float-shadow)}
.legend{position:absolute;z-index:450;left:calc(var(--pw) + 16px);bottom:28px;width:300px;padding:10px 12px}
.ws.has-player .legend{bottom:104px}
.legend .t{font-size:12px;font-weight:500;margin-bottom:6px}
.legend .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;height:6px;border-radius:3px;overflow:hidden}
.legend .lbl{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:5px;font-size:10px;color:var(--muted-fg);line-height:1.25}
.legend .lbl b{display:block;color:var(--foreground);font-weight:500;font-size:10.5px}
.legend .extra{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11px;color:var(--muted-fg)}
.legend .extra span{display:inline-flex;align-items:center;gap:5px}
.legend .ln{width:14px;border-top:2px solid var(--plume)}
.player{position:absolute;z-index:460;left:calc(var(--pw) + 16px);right:16px;bottom:28px;display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px}
.player .play{width:40px;height:40px;padding:0;border-radius:999px;flex:none}
.player .track{flex:1;min-width:0}
.player input[type=range]{width:100%;accent-color:var(--violet);margin:0}
.player .ticks{display:flex;justify-content:space-between;font:400 10px/1 var(--font-mono);color:var(--muted-fg);margin-top:3px}
.player .when{text-align:right;font-size:12.5px;font-weight:500;min-width:140px;line-height:1.35}
.player .when small{display:block;font-weight:400;font-size:11px;color:var(--muted-fg)}
.seg3d{position:absolute;z-index:470;top:14px;right:58px;display:flex;padding:3px;gap:2px;border-radius:999px}
.ws.story .seg3d{right:16px}
.ws.story .panel{background:color-mix(in srgb,var(--background) 94%,transparent)}
.seg3d button{height:28px;padding:0 12px;border:0;border-radius:999px;background:none;font-size:12.5px;font-weight:500;color:var(--muted-fg);cursor:pointer}
.seg3d button[aria-pressed="true"]{background:var(--foreground);color:var(--background)}
.seg3d button:disabled{opacity:.4;cursor:default}
/* 3D story: always the night palette, like Elevate's cinematic dark bands */
#story{position:absolute;inset:0;z-index:430;background:#0b0a12;overflow:hidden;touch-action:none}
#story canvas{display:block;width:100%;height:100%}
.stage.night{--background:#14111d;--card:#1c1927;--muted:#25212f;--foreground:#fafafa;--muted-fg:#b3b0bf;--border:rgb(255 255 255/.1);--input:rgb(255 255 255/.2);
  --accent:color-mix(in srgb,#fafafa 8%,#1c1927);--violet:#b79bff;--amber:#ffb224;--sea:#0b0a12;--plume:#d9c2a8;--float-shadow:0 24px 60px -28px rgba(0,0,0,.9);color:var(--foreground)}
.stage.night .caption{text-shadow:0 1px 2px #000,0 0 10px rgb(0 0 0/.7)}
.slbl{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;font:500 11px/1.2 var(--font-sans);color:rgb(250 250 250/.82);
  text-shadow:0 1px 2px #000,0 0 8px #000;will-change:transform}
.slbl.fire{color:#ffbf80}
.slbl.st{color:#fafafa;font-size:11.5px}
.slbl.st b{font-weight:600;font-variant-numeric:tabular-nums;margin-left:4px}
.slbl .d{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:0}
.story-hint{position:absolute;right:18px;top:62px;z-index:2;font-size:11px;color:rgb(250 250 250/.6);pointer-events:none}

/* leaflet, in the house style */
.leaflet-container{background:var(--sea);font-family:var(--font-sans)}
.leaflet-bar{border:1px solid var(--border)!important;border-radius:999px!important;overflow:hidden;box-shadow:var(--float-shadow)!important}
.leaflet-bar a{background:var(--background)!important;color:var(--foreground)!important;border-color:var(--border)!important;width:32px!important;height:32px!important;line-height:32px!important}
.leaflet-bar a:hover{background:var(--muted)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--background) 80%,transparent)!important;color:var(--muted-fg)!important;font-size:10px!important}
.leaflet-tooltip{background:var(--background);color:var(--foreground);border:1px solid var(--border);border-radius:10px;font:12px/1.45 var(--font-sans);box-shadow:var(--float-shadow);padding:5px 9px}
.leaflet-tooltip-top:before{border-top-color:var(--background)}
.stn-icon{background:none;border:0}
.stn{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;font:600 9.5px/1 var(--font-sans);color:var(--chip-ink);font-variant-numeric:tabular-nums;
  box-shadow:0 0 0 2px var(--background),0 1px 4px rgb(0 0 0/.35);cursor:pointer}
.stn-icon.sel{z-index:1000!important}
.stn-icon.sel .stn{box-shadow:0 0 0 2px var(--background),0 0 0 4px var(--violet),0 2px 6px rgb(0 0 0/.4);transform:scale(1.15)}
.plabel{background:none;border:0;font:500 11px/1 var(--font-sans);color:var(--muted-fg);white-space:nowrap;text-shadow:0 0 3px var(--sea),0 0 3px var(--sea),0 0 3px var(--sea)}
.plabel.country{font:400 13px/1 var(--font-display);letter-spacing:.3em;text-transform:uppercase;color:color-mix(in srgb,var(--muted-fg) 70%,transparent)}

.toast{position:fixed;left:50%;top:56px;transform:translateX(-50%);z-index:2000;background:var(--foreground);color:var(--background);border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:500;box-shadow:var(--float-shadow);max-width:calc(100% - 32px)}
.about p{font-size:13px;line-height:1.6}
.about ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6}
.cat-row{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;padding:7px 0;border-top:1px solid var(--border);font-size:12.5px}
.cat-row:first-child{border-top:0}
pre.sum{white-space:pre-wrap;margin:0;font:12px/1.55 var(--font-mono);background:var(--muted);border:1px solid var(--border);border-radius:14px;padding:10px 12px}

@media (max-width:1180px){.bar .ctx{display:none}}
@media (max-width:1020px){.caption{display:none}.legend{width:260px}
  .stage.night .caption{display:block;left:14px;top:12px;max-width:calc(100% - 28px)}.stage.night .caption .rg{font-size:1.4rem}.story-hint{display:none}}
@media (max-width:760px){
  :root{--pw:0px}
  .seg3d,.ws.story .seg3d{right:10px;top:10px}
  .stage.night .caption{top:56px}
  html,body{height:auto}
  .app{display:block;height:auto;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .bar{position:sticky;top:env(safe-area-inset-top,0px);height:48px}
  .bar .lbl-long{display:none}
  .ws{overflow:visible}
  .stage{position:relative;height:56vh;min-height:340px}
  #three{left:0}
  .panel{position:static;width:auto;background:var(--background);-webkit-backdrop-filter:none;backdrop-filter:none;border-right:0;border-top:1px solid var(--border);padding-left:0}
  .modes{position:fixed;z-index:950;left:0;right:0;bottom:0;margin:0;border-radius:0;border:0;border-top:1px solid var(--border);background:var(--background);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .mode{flex-direction:column;gap:2px;height:46px;font-size:10.5px;border-radius:12px}
  .mode svg.i{display:block;width:19px;height:19px}
  .mode[aria-selected="true"]{box-shadow:none;background:var(--brand-soft)}
  .pbody{overflow:visible;padding:14px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
  .legend{display:none}
  .player{left:10px;right:10px;bottom:10px;padding:6px 10px 6px 6px;gap:8px}
  .player .when{min-width:0;font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

function byProvince(list){

    const e=m.get(k)||{pl:c.place,f:0,towns:new Map()};e.f+=f;e.towns.set(c.place[0],(e.towns.get(c.place[0])||0)+f);m.set(k,e)}
  return [...m.values()].sort((a,b)=>b.f-a.f).map(e=>({pl:e.pl,f:e.f,towns:[...e.towns.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0])}));

const T0=H.t_now;

H.stations.forEach(s=>{
  s.obsMap=new Map(s.obs);
  s.fcMap=new Map((s.fc?s.fc.series:[]).filter(r=>r[0]>T0).map(r=>[r[0],r[2]]));
  s.now=s.obsMap.get(T0)??s.api;
  s.days=[0,1,2].map(k=>{const a=DAY0+k*86400,b=a+86400;let pk=null;
    for(const [x,v] of s.obsMap)if(x>=a&&x<b&&x<=T0&&(pk==null||v>pk))pk=v;
    for(const [x,v] of s.fcMap)if(x>=a&&x<b&&(pk==null||v>pk))pk=v;
    return {start:a,peak:pk}});
  let p=null;for(const [x,v] of s.fcMap)if(x<=T0+72*HR&&(p==null||v>p))p=v;s.pk72=p;
  const fx=[...s.fcMap.keys()].filter(x=>x<=T0+72*HR).sort((a,b)=>a-b);s.fcEnd=fx.length?fx.at(-1):T0;
  const curUnh=(s.now||0)>100,futUnh=fx.some(x=>s.fcMap.get(x)>100);
  if(!curUnh&&!futUnh)s.ease={k:'ok'};
  else{let last=-1;fx.forEach((x,i)=>{if(s.fcMap.get(x)>100)last=i});
    s.ease=(last>=0&&last<fx.length-1)?{k:'by',at:fx[last+1]}:(last<0?{k:'by',at:fx[0]}:{k:'none'})}
});

function nationModel(){
  const unh=ST.filter(s=>s.now>100),worst=[...ST].sort((a,b)=>(b.now||0)-(a.now||0));
  const days=[0,1,2].map(k=>{const c=[0,0,0,0,0];ST.forEach(s=>{const p=s.days[k].peak;if(p!=null)c[catOf(p)]++});return c});
  const mNow=ST.reduce((a,s)=>a+(s.now||0),0)/ST.length,mD2=ST.reduce((a,s)=>a+(s.days[2].peak??s.now??0),0)/ST.length;
  const trend=mD2-mNow>10?'up':mD2-mNow<-10?'down':'flat';
  const st=new Map();ST.forEach(s=>{const v=Math.max(s.pk72||0,s.now||0);st.set(stateOf(s),Math.max(st.get(stateOf(s))||0,v))});
  const topStates=[...st.entries()].filter(e=>e[1]>100).sort((a,b)=>b[1]-a[1]).slice(0,2).map(e=>e[0]);
  return {unh,worst,days,trend,topStates,provs:byProvince(H.priority).slice(0,3)};
}

// fire layer, drawn per tile from the packed detections
let F=null,fT=0,fireLayer=null;const tiles=new Set();
function decodeFires(){
  const f=D.fires,la=new Uint16Array(b64(f.lat)),lo=new Uint16Array(b64(f.lon)),dt=new Uint16Array(b64(f.dt)),fr=new Uint8Array(b64(f.frp));
  const N=f.n,lat=new Float32Array(N),lon=new Float32Array(N),tm=new Float64Array(N),rad=new Float32Array(N),wx=new Float64Array(N),wy=new Float64Array(N);
  for(let i=0;i<N;i++){lat[i]=la[i]*.0005-12;lon[i]=lo[i]*.001+94;tm[i]=f.t0+dt[i]*300;rad[i]=Math.min(1.5+(fr[i]/8)/3.5,6);
    const s=Math.sin(lat[i]*Math.PI/180);wx[i]=(lon[i]+180)/360*256;wy[i]=(.5-Math.log((1+s)/(1-s))/(4*Math.PI))*256}
  return {N,lat,lon,tm,rad,wx,wy,t0:tm[0],t1:tm[N-1]};
}
function drawTile(cv){
  const ctx=cv.getContext('2d'),{x,y,z}=cv._c,k=2**z,ox=x*256,oy=y*256;ctx.clearRect(0,0,256,256);
  const bins=[new Path2D(),new Path2D(),new Path2D()];
  for(let i=0;i<F.N;i++){if(F.tm[i]>fT)break;const px=F.wx[i]*k-ox,py=F.wy[i]*k-oy,r=F.rad[i];
    if(px<-r||py<-r||px>256+r||py>256+r)continue;const a=fT-F.tm[i],b=bins[a<12*HR?2:a<48*HR?1:0];b.moveTo(px+r,py);b.arc(px,py,r,0,7)}
  ctx.globalAlpha=.9;[tok('fire-old'),tok('fire-mid'),tok('fire-new')].forEach((c,j)=>{ctx.fillStyle=c;ctx.fill(bins[j])});
}
map.createPane('fires').style.zIndex=450;
function ensureFires(){
  if(fireLayer)return;if(!F){F=decodeFires();fT=F.t1}
  const FL=L.GridLayer.extend({createTile(c){const cv=document.createElement('canvas');cv.width=cv.height=256;cv._c=c;tiles.add(cv);drawTile(cv);return cv}});
  fireLayer=new FL({pane:'fires',updateWhenZooming:false});fireLayer.on('tileunload',e=>tiles.delete(e.tile));
}

// ======================================================= charts: hand-drawn SVG, like Elevate's chart cards
function lineChart({x0,x1,yMax,series,xticks,thr=[],nowX=null,w=372,h=190}){
  const L0=30,R0=6,Tp=8,B0=20,iw=w-L0-R0,ih=h-Tp-B0;
  const X=v=>L0+(v-x0)/(x1-x0)*iw,Y=v=>Tp+ih-Math.min(v,yMax)/yMax*ih;
  const step=[50,100,200,500,1000,2000,5000].find(v=>yMax/v<=5)||10000;
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">`;
  for(let v=0;v<=yMax+.1;v+=step)s+=`<line class="grid" x1="${L0}" x2="${w-R0}" y1="${Y(v)}" y2="${Y(v)}"/><text class="yl" x="${L0-5}" y="${Y(v)+3}">${fmtN(v)}</text>`;
  xticks.forEach(([v,l])=>{s+=`<text class="xl" x="${X(v)}" y="${h-5}">${l}</text>`});
  thr.forEach(([v,l])=>{if(v<yMax)s+=`<line class="thr" x1="${L0}" x2="${w-R0}" y1="${Y(v)}" y2="${Y(v)}"/><text class="thl" x="${w-R0}" y="${Y(v)-3}">${l}</text>`});
  if(nowX!=null)s+=`<line class="now" x1="${X(nowX)}" x2="${X(nowX)}" y1="${Tp}" y2="${Tp+ih}"/><text x="${X(nowX)+4}" y="${Tp+8}">${t('now')}</text>`;
  series.forEach(se=>{if(!se.pts.length)return;const d=se.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join('');
    if(se.area)s+=`<path d="${d}L${X(se.pts.at(-1)[0]).toFixed(1)},${Y(0)}L${X(se.pts[0][0]).toFixed(1)},${Y(0)}Z" style="fill:${se.color};opacity:.18;stroke:none"/>`;
    s+=`<path d="${d}" style="fill:none;stroke:${se.color};stroke-width:${se.width||1.8}" ${se.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if(se.dots)se.pts.forEach(p=>{s+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="2.5" style="fill:${se.color}"/>`})});
  return s+`<line class="cur" x1="0" x2="0" y1="${Tp}" y2="${Tp+ih}" style="stroke:var(--muted-fg);stroke-width:1;opacity:0"/></svg>`;
}
function hoverChart(wrap,{x0,x1,w=372,series,fmt}){
  const svg=wrap.querySelector('svg'),cur=svg.querySelector('.cur'),tip=document.createElement('div');tip.className='ctip';tip.hidden=true;wrap.appendChild(tip);
  const L0=30,R0=6,iw=w-L0-R0;
  svg.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect(),vx=(e.clientX-r.left)/r.width*w;if(vx<L0||vx>w-R0){tip.hidden=true;cur.style.opacity=0;return}
    const xv=x0+(vx-L0)/iw*(x1-x0);let best=null;
    const rows=series.map(se=>{let b=null;for(const p of se.pts)if(b==null||Math.abs(p[0]-xv)<Math.abs(b[0]-xv))b=p;
      if(b&&Math.abs(b[0]-xv)<3*HR){best=best??b[0];return `<div><span class="dot" style="background:${se.color};margin-right:5px"></span>${se.name} <b>${b[1]}</b></div>`}return ''}).join('');
    if(!rows){tip.hidden=true;cur.style.opacity=0;return}
    const px=L0+(best-x0)/(x1-x0)*iw;cur.setAttribute('x1',px);cur.setAttribute('x2',px);cur.style.opacity=.5;
    tip.innerHTML=`<div class="muted">${fmt(best)}</div>${rows}`;tip.hidden=false;
    tip.style.left=Math.min(Math.max(0,px/w*r.width-60),r.width-140)+'px';tip.style.top='-8px'});
  svg.addEventListener('pointerleave',()=>{tip.hidden=true;cur.style.opacity=0});
}
function barChart({labels,stacks,w=372,h=160}){
  const L0=34,R0=4,Tp=6,B0=18,iw=w-L0-R0,ih=h-Tp-B0,n=labels.length;
  const tot=labels.map((_,i)=>stacks.reduce((a,s)=>a+s.vals[i],0)),yMax=Math.max(1,...tot)*1.08;
  const step=[1,2,5,10,20,50,100,200,500,1000,2000,5000,10000,20000,50000].find(v=>yMax/v<=4)||100000;
  const Y=v=>Tp+ih-v/yMax*ih,bw=iw/n*.62;
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">`;
  for(let v=0;v<=yMax;v+=step)s+=`<line class="grid" x1="${L0}" x2="${w-R0}" y1="${Y(v)}" y2="${Y(v)}"/><text class="yl" x="${L0-5}" y="${Y(v)+3}">${v>=1000?(v/1000)+'k':v}</text>`;
  labels.forEach((l,i)=>{const c=L0+iw/n*(i+.5);let acc=0;
    stacks.forEach(st=>{const v=st.vals[i];if(!v)return;const y1=Y(acc),y2=Y(acc+v);s+=`<rect x="${(c-bw/2).toFixed(1)}" y="${y2.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,y1-y2).toFixed(1)}" rx="2" style="fill:${st.color}"><title>${st.name}: ${fmtN(v)}</title></rect>`;acc+=v});
    s+=`<text class="xl" x="${c}" y="${h-5}">${l}</text>`});

function drawSmoke(x){
  smokeX=x;paintStations(s=>apiAt(s,x));

  for(const [p,l] of plumes){const h=Math.floor((x-p.t0)/HR);

    const end=Math.min(h,p.p.length-1),beg=Math.max(0,end-20);l.setLatLngs(p.p.slice(beg,end+1).map(([a,b])=>[b,a]));l.setStyle({color:pc})}

      p.setLatLngs([[la,lo],[ty,tx],[ty+hl*Math.sin(a+2.6),tx+hl*Math.cos(a+2.6)/kx],[ty,tx],[ty+hl*Math.sin(a-2.6),tx+hl*Math.cos(a-2.6)/kx]]);p.setStyle({color:wc})})}

// ---------- 3D terrain of one fire area
let R3=null;
function init3D(){
  const host=$('three'),r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(r.domElement);
  const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,2000);cam.position.set(0,-95,75);cam.up.set(0,0,1);
  const ctl=new THREE.OrbitControls(cam,r.domElement);ctl.enableDamping=true;
  scene.add(new THREE.AmbientLight(0xffffff,.6));const sun=new THREE.DirectionalLight(0xffffff,.75);sun.position.set(-60,-40,120);scene.add(sun);
  const fit=()=>{const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;const pr=r.getPixelRatio();if(r.domElement.width!==Math.round(w*pr)||r.domElement.height!==Math.round(h*pr)){r.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}};
  (function loop(){requestAnimationFrame(loop);if(host.hidden)return;fit();ctl.update();r.render(scene,cam)})();
  R3={scene};
}
function build3D(c){

    :'Jerebu Watch connects the fires in Indonesia to the air in Malaysia: the latest API readings, a 3-day forecast for every DOE station, and which fires are sending smoke to your town.'}</p>
  <div class="callout amber"><div class="ct">${ic('alert')}${ms?'Bukan ramalan rasmi':'Not an official forecast'}</div>${ms?'Untuk bacaan dan amaran rasmi, rujuk':'For official readings and warnings, see'} <a href="https://eqms.doe.gov.my/APIMS/main" target="_blank" rel="noopener">DOE APIMS</a> ${ms?'dan ikut arahan pihak berkuasa.':'and follow your local authorities.'}</div>
  <div class="card">${cardH('info','blue',ms?'Maksud nombor IPU':'What the API numbers mean',t('todo_src'))}<div>${cats}</div></div>
  <div class="card">${cardH('chart','violet',ms?'Bagaimana ia berfungsi':'How it works','')}
    <p>${b(ms?'Kebakaran':'Fires')} ${ms?'Satelit NASA (VIIRS) mengesan titik panas beberapa kali sehari. Titik panas berdekatan dikumpulkan menjadi kawasan kebakaran dan dinamakan mengikut bandar terdekat.':'NASA satellites (VIIRS) spot fire hotspots several times a day. Nearby hotspots are grouped into fire areas and named after the nearest town.'}</p>
    <p>${b(ms?'Kualiti udara':'Air quality')} ${ms?'Bacaan IPU setiap jam dari 68 stesen JAS, 7 hari lepas.':'Hourly API readings from DOE\'s 68 stations, last 7 days.'}</p>
    <p>${b(ms?'Ramalan':'Forecast')} ${ms?'Bermula dengan bacaan terkini setiap stesen, kemudian beransur-ansur mengikut ramalan asap Copernicus CAMS yang dilaraskan kepada bacaan stesen itu. Diuji pada data minggu lepas, ramalan 3 hari tersasar purata kira-kira 11 mata IPU.':'It starts from each station\'s latest reading, then gradually follows the Copernicus CAMS smoke forecast, tuned to that station\'s own readings. Tested on last week\'s data, the 3-day forecast was off by about 11 API points on average.'}</p>
    <p>${b(ms?'Laluan asap':'Smoke paths')} ${ms?'Mengikut ramalan angin dari setiap kawasan kebakaran. Ia panduan, bukan model penuh.':'They follow the forecast wind from each fire area. A guide, not a full air-quality model.'}</p>
    ${D.briefing?`<p>${b(ms?'Ringkasan AI':'AI briefing')} ${ms?'Ditulis oleh DeepSeek semasa halaman dibina, hanya daripada angka di halaman ini. Ringkasan yang menyebut angka lain ditolak.':'Written by DeepSeek when the page is built, from the numbers on this page only. A briefing that mentions any other number is rejected.'}</p>`:''}</div>
  <div class="card">${cardH('list','blue',ms?'Sumber data':'Data sources','')}<ul>
    <li>NASA FIRMS, VIIRS (NOAA-20, NOAA-21, S-NPP)</li><li>${ms?'Jabatan Alam Sekitar Malaysia, APIMS':'Department of Environment Malaysia, APIMS'}</li><li>Copernicus CAMS PM2.5 ${ms?'melalui':'via'} Open-Meteo</li><li>${ms?'Ramalan angin melalui Open-Meteo':'Wind forecast via Open-Meteo'}</li><li>Natural Earth, AWS Terrain Tiles</li></ul>
    <p class="note">${ms?'Data dikemas kini':'Data updated'} ${fStamp(D.generated)} MYT.</p></div>
  <div class="card">${cardH('share','violet',ms?'Kongsi':'Share',ms?'Teks untuk media sosial':'Text for social media')}<pre class="sum" id="sumText">${esc(summaryText())}</pre></div></div>`;
};

// ======================================================= share text
function summaryText(){
  const M=nationModel(),n=M.unh.length,w=M.worst.slice(0,3).map(s=>`${s.area} ${s.now}`),d=M.days.map(unhOf),p=listJoin(M.provs.map(g=>prov(g.pl)));
  if(LANG==='ms')return `Jerebu: ${n} daripada ${ST.length} kawasan di Malaysia mencatat udara TIDAK SIHAT (IPU, ${fStamp(H.t_obs)}).
Paling teruk: ${w.join(', ')}.
3 hari akan datang: ${d[0]} / ${d[1]} / ${d[2]} kawasan dijangka tidak sihat.
Punca utama asap: kebakaran di ${p}, Indonesia.
Pakai pelitup muka di luar, kurangkan aktiviti luar, minum banyak air.
Ramalan tidak rasmi. Bacaan rasmi: APIMS JAS.
#jerebu #IPU #haze #Malaysia`;
  return `Haze: ${n} of ${ST.length} areas in Malaysia have UNHEALTHY air (API, ${fStamp(H.t_obs)}).
Worst: ${w.join(', ')}.
Next 3 days: ${d[0]} / ${d[1]} / ${d[2]} areas expected unhealthy.
Main smoke source: fires in ${p}, Indonesia.
Wear a mask outdoors, cut down outdoor activity, drink plenty of water.
Unofficial forecast. Official readings: DOE APIMS.
#jerebu #haze #IPU #Malaysia`;
}
function toast(m){const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=m;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)}
$('shareBtn').onclick=()=>{const txt=summaryText();
  const fail=()=>{setMode('about');const pre=$('sumText');if(pre){const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);pre.scrollIntoView({block:'center'})}toast(t('copy_fail'))};
  try{navigator.clipboard.writeText(txt).then(()=>toast(t('copied')),fail)}catch(e){fail()}};

// ======================================================= theme, language, boot
const darkNow=()=>{const a=document.documentElement.getAttribute('data-theme');return a?a==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
function paintChrome(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=t(e.dataset.i);if(typeof v==='string')e.textContent=v});
  $('langBtn').querySelector('.lbl').textContent=LANG==='ms'?'EN':'BM';
  $('langBtn').setAttribute('aria-label',LANG==='ms'?'Switch to English':'Tukar ke Bahasa Melayu');
  $('shareBtn').setAttribute('aria-label',t('share'));
  const ago=Math.max(0,Math.floor((Date.now()/1000-D.generated)/HR));
  $('barCtx').textContent=`${t('bar_ctx',fStamp(H.t_obs))} · ${t('updated_ago',ago)}`;
  const cb=document.documentElement.getAttribute('data-cb')==='1';$('cbBtn').setAttribute('aria-pressed',cb);$('cbBtn').setAttribute('aria-label',t(cb?'cb_on':'cb_off'));$('cbBtn').title=t(cb?'cb_on':'cb_off');
  $('storyHint').textContent=t('drag');segLabels();if(SC)SC.relabel();
  const d=darkNow();$('themeBtn').innerHTML=ic(d?'sun':'moon');$('themeBtn').setAttribute('aria-label',d?t('theme_light'):t('theme_dark'));
}
$('langBtn').onclick=()=>{LANG=LANG==='ms'?'en':'ms';try{localStorage.setItem('jw-lang',LANG)}catch(e){}paintChrome();RENDER[mode]({focus:mode==='fires'})};
$('cbBtn').onclick=()=>{const on=document.documentElement.getAttribute('data-cb')!=='1';document.documentElement.setAttribute('data-cb',on?'1':'0');try{localStorage.setItem('jw-cb',on?'1':'0')}catch(e){}};
try{if(localStorage.getItem('jw-cb')==='1')document.documentElement.setAttribute('data-cb','1')}catch(e){}
$('themeBtn').onclick=()=>{const next=darkNow()?'light':'dark';document.documentElement.setAttribute('data-theme',next);try{localStorage.setItem('jw-theme',next)}catch(e){}};
try{const th=localStorage.getItem('jw-theme');if(th==='dark'||th==='light')document.documentElement.setAttribute('data-theme',th)}catch(e){}
function onTheme(){restyleLand();paintChrome();if(SC)SC.relabel();if(mode==='today'||mode==='area'||mode==='about')RENDER[mode]({keepScroll:true});else paintStations();if(F)tiles.forEach(drawTile);if(mode==='smoke'){srcMk.forEach(m=>m.setStyle({fillColor:tok('fire-mid')}));drawSmoke(smokeX)}
  if(mode==='area')backLayer.eachLayer(l=>l.setStyle({color:tok('back')}));if(R3&&!$('three').hidden)build3D(selFire)}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',onTheme);
new MutationObserver(onTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','data-cb']});
addEventListener('resize',()=>{map.invalidateSize();if(SC)SC.resize()});

paintChrome();
const startMode=(location.hash||'').slice(1);let savedMode=null;try{savedMode=localStorage.getItem('jw-mode')}catch(e){}
setMode(MODES.includes(startMode)?startMode:(MODES.includes(savedMode)?savedMode:'today'),{keepScroll:true});
</script>
